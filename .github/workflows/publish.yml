# 只发布 main 中的新正式版本；版本号由维护者修改，CI 不自动增号。
name: Publish npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'bilbilmyc/memobox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: 判定是否为尚未发布的新正式版本
        run: node scripts/release/plan.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true' && github.repository == 'bilbilmyc/memobox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 固定支持 OIDC 的 npm 版本
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*64'
          path: artifacts
      - name: 发布五个平台已验收的 GitHub Release 资产并核对上传字节
        run: node scripts/release/assets.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 用 OIDC 发布已验证的 tarball，核对 registry
        run: node scripts/release/package.mjs publish
      - name: 从公开 npm/GitHub 重新安装并验收
        run: node scripts/native/test-package.mjs release
        env:
          PUBLIC_RELEASE_TEST: '1'
