# CI：依赖安装 → 单测 + 类型检查。
# v2.0 是纯 CLI 包（bun:sqlite 内置，无外部服务、无构建产物）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 钉版本：bun:sqlite 的多语句 exec 在 patch 版本间有漂移，
      # 本地与 CI 固定同一条基线
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # 真 CLI 冒烟：save → search 全链路（隔离到临时库文件）
      - name: CLI smoke test
        run: |
          export MEMOBOX_DB_PATH=$(mktemp -d)/memobox.db
          bun src/cli.ts save "CI probe: prefer tabs over spaces" --entities ci,style
          bun src/cli.ts search "tabs" | grep "CI probe"
          bun src/cli.ts stats
